# Publishes the browser build to GitHub Pages on every push to main.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Downloaded, not piped: a piped script shares stdin with its source.
      - name: install minc
        run: |
          curl -fsSL https://minc.dev/install -o "$RUNNER_TEMP/install.sh"
          bash "$RUNNER_TEMP/install.sh" < /dev/null
          echo "$HOME/.minc" >> "$GITHUB_PATH"

      - run: minc --version

      # build.mc compiles build/web/minc-synth.wasm and stages fonts/,
      # patches/, patches/index.txt and assets.json beside it.
      - name: build
        run: minc build wasm

      # The page and the hosts that `minc wasm` stages for its dev server.
      # The hosts come from the minc that built the .wasm, so the JS and
      # the sokol modules compiled into it are the same version.
      - name: stage page + hosts
        run: |
          cp web/synth.html build/web/index.html
          cp "$HOME/.minc/lib/wasm/sokol_wasm_host.js" build/web/
          cp "$HOME/.minc/lib/wasm/sokol_wasm_audio_worklet.js" build/web/
          ls -lR build/web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
