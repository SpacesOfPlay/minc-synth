<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>minc-synth</title>
<style>
  html, body { margin: 0; height: 100%; background: #121212; overflow: hidden; }
  #canvas { display: block; width: 100%; height: 100%; }
  #err { position: fixed; left: 16px; top: 12px; color: #e62226; font: 14px system-ui, sans-serif; display: none; }
  /* Browsers keep audio off until the page gets a click or a key: a
     modal in the app's colours asks for one before anything plays. */
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
           background: rgba(0, 0, 0, 0.6); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #start .box { background: #202020; border: 1px solid #383838; padding: 28px 32px; max-width: 360px;
                margin: 16px; color: #a8a8a8; font-size: 14px; line-height: 1.5; }
  #start h1 { margin: 0 0 8px; color: #f5f5f5; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
  #start p { margin: 0 0 20px; }
  #start button { background: #e62226; color: #fff; border: 0; padding: 8px 28px; font: inherit;
                  font-weight: 700; cursor: pointer; transition: background-color 0.12s; }
  #start button:hover { background: #ff3b3f; }
  #start button:active { background: #b81b1e; }
  #start button:focus-visible { outline: 2px solid #f5f5f5; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="err"></div>
<div id="start" role="dialog" aria-modal="true" aria-labelledby="start-title">
  <div class="box">
    <h1 id="start-title">MINC-SYNTH</h1>
    <p>The browser plays sound only after a click or a key. Click OK to start. Play with Z-M, Q-I, see help for more info.</p>
    <button id="start-ok">OK</button>
  </div>
</div>
<script src="sokol_wasm_host.js"></script>
<script>
// minc-synth's page: the stock host with two imports the app uses for
// persistence, since the browser has no file system. A patch is kept in
// localStorage and in the URL hash, so a link carries a patch.
(async () => {
    const S = window.sokolWasm;
    const KEY = 'minc-synth.patch';
    const mem = () => new Uint8Array(S.instance.exports.memory.buffer);
    const cstr = (ptr) => {
        const u8 = mem();
        let end = ptr;
        while (u8[end] !== 0 && end - ptr < 64) end++;
        return new TextDecoder().decode(u8.slice(ptr, end));
    };
    const getText = (key) => {
        try {
            if (key === 'hash') return location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : '';
            if (key === 'store') return localStorage.getItem(KEY) || '';
        } catch (e) { console.warn('web_text_read', key, e); }
        return '';
    };
    const setText = (key, text) => {
        try {
            if (key === 'hash') history.replaceState(null, '', '#' + encodeURIComponent(text));
            if (key === 'store') localStorage.setItem(KEY, text);
        } catch (e) { console.warn('web_text_write', key, e); }
    };
    const orig = S.makeImports;
    S.makeImports = function() {
        const im = orig.call(S);
        // web_text_read(key, buf, cap): the text's length, copied into buf
        // when it fits; the app calls again with a bigger buffer if not.
        im.env.web_text_read = (keyPtr, bufPtr, cap) => {
            const bytes = new TextEncoder().encode(getText(cstr(keyPtr)));
            if (bytes.length <= cap) mem().set(bytes, bufPtr);
            return bytes.length;
        };
        im.env.web_text_write = (keyPtr, textPtr, len) => {
            setText(cstr(keyPtr), new TextDecoder().decode(mem().slice(textPtr, textPtr + len)));
        };
        return im;
    };
    // OK, Enter or Space starts the audio; the app takes the keys from the
    // window, so nothing needs focus afterwards.
    const start = document.getElementById('start');
    const ok = document.getElementById('start-ok');
    ok.focus();
    ok.addEventListener('click', () => {
        const ctx = S._saudioCtx;
        if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
        start.remove();
    });
    try {
        let assets = [];
        try {
            const r = await fetch('assets.json');
            if (r.ok) assets = await r.json();
        } catch (e) { /* no manifest */ }
        await S.preloadAudioWorklet({ sampleRate: 48000 });
        await S.preloadAssets(assets);
        await S.runAuto('minc-synth');
    } catch (e) {
        const el = document.getElementById('err');
        el.textContent = 'minc-synth could not start: ' + (e.message || e);
        el.style.display = 'block';
        console.error(e);
    }
})();
</script>
</body>
</html>
